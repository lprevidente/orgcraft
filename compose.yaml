name: orgcraft
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=orgcraft'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  spicedb:
    image: 'authzed/spicedb:latest'
    command: serve
    environment:
      - 'SPICEDB_GRPC_PRESHARED_KEY=orgcraft-dev-key'
      - 'SPICEDB_DATASTORE_ENGINE=memory'
      - 'SPICEDB_HTTP_ENABLED=true'
    ports:
      - '50051:50051'
      - '8443:8443'

  grpcui:
    image: 'fullstorydev/grpcui:latest'
    command: >
      -bind 0.0.0.0
      -port 8080
      -plaintext
      -H 'authorization: Bearer orgcraft-dev-key'
      spicedb:50051
    ports:
      - '8090:8080'
    depends_on:
      - spicedb