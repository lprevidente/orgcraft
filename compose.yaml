name: orgcraft
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=orgcraft'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  spicedb:
    image: 'authzed/spicedb:latest'
    command: serve
    environment:
      - 'SPICEDB_GRPC_PRESHARED_KEY=orgcraft-dev-key'
      - 'SPICEDB_DATASTORE_ENGINE=memory'
    ports:
      - '50051:50051'
      - '8443:8443'