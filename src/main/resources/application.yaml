spring:
  application:
    name: orgcraft

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  datasource:
    hikari:
      auto-commit: false

  # Datasource
  sql:
    init:
      mode: always

  # Virtual Threads
  threads:
    virtual:
      enabled: true

  # Spring Modulith event publication registry
  modulith:
    events:
      # Recover publications stuck in-flight (e.g. JVM killed mid-processing) by
      # marking them FAILED so the resubmit job below can retry them.
      staleness:
        check-intervall: 1m   # how often to scan for stale publications
        published: 5m         # PUBLISHED rows never picked up within 5m are stale
        processing: 5m        # PROCESSING rows not completed within 5m are stale
        resubmitted: 5m       # RESUBMITTED rows not completed within 5m are stale

orgcraft:
  spicedb:
    enabled: true
    endpoint: localhost:50051
    preshared-key: orgcraft-dev-key
    plaintext: true